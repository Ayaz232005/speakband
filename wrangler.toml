# SpeakBand API worker — Cloudflare Workers (free tier: 100k requests/day).
# Live at https://speakband-api.ayazawan273.workers.dev (deployed 2026-10-22).
# Deploys go through the API scripts in
# ~/workspace/custom-connectors/custom.cloudflare/bin/ (cf_deploy_worker.py,
# cf_deploy_pages.py) — no wrangler login needed. The static site (index.html,
# practice.html, app.js, ...) is hosted on Cloudflare Pages project
# "speakband"; the frontend calls this worker at its absolute URL (CORS is
# open on the worker), so no Workers Route is required.
# Secrets (set once via the Cloudflare dashboard, never committed):
#   GEMINI_API_KEY   # Google AI Studio free key (primary scorer)
#   GROQ_API_KEY     # GroqCloud free key (fallback scorer)

name = "speakband-api"
main = "worker.js"
compatibility_date = "2026-10-22"

# KV namespace for per-IP grading quotas + waitlist emails.
[[kv_namespaces]]
binding = "KV"
id = "341eef104d9d49039ed6cede15f30fe1"
